name: Feedback or idea
description: Share what felt good, confusing, or missing.
labels: ["feedback", "beta"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
      description: What were you trying to do, and how did it feel?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - 2D planner (Map / Table / Grid)
        - Space (3D view)
        - Maps library / import / export
        - Something else
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Filled in automatically by the Feedback link.
      render: text
